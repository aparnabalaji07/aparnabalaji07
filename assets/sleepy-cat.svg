<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="900" height="170">
  <defs>
    <clipPath id="b"><path d="M420 128 C 420 100, 440 82, 472 82 C 506 82, 524 100, 522 116 C 520 128, 508 132, 480 132 L 430 132 Z"/></clipPath>
    <clipPath id="h"><path d="M396 100 C 396 89, 409 84, 421 84 C 433 84, 446 89, 446 100 C 449 110, 445 120, 435 125 C 428 128, 414 128, 407 125 C 397 120, 393 110, 396 100 Z"/></clipPath>
  </defs>
  <style>
    .breathe { transform-origin: 470px 132px; animation: breathe 3.4s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { transform: scale(1,1) } 50% { transform: scale(1.015,1.05) } }
    .z { font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight:700; fill:#e8963f; opacity:0; animation: zz 3.6s ease-out infinite; }
    @keyframes zz { 0% { opacity:0; transform: translate(0,0) } 20% { opacity:1 } 100% { opacity:0; transform: translate(18px,-30px) } }
    .tw { animation: tw 3s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity:.2 } 50% { opacity:1 } }
  </style>
  <rect width="900" height="170" rx="22" fill="#1a1230"/>
  <g fill="#f3d9c6">
    <circle class="tw" cx="120" cy="40" r="1.6"/>
    <circle class="tw" cx="250" cy="120" r="1.3" style="animation-delay:.8s"/>
    <circle class="tw" cx="680" cy="35" r="1.8" style="animation-delay:1.5s"/>
    <circle class="tw" cx="790" cy="115" r="1.4" style="animation-delay:.4s"/>
    <circle class="tw" cx="330" cy="30" r="1.2" style="animation-delay:2.1s"/>
    <circle class="tw" cx="590" cy="140" r="1.5" style="animation-delay:1.1s"/>
  </g>
  <!-- cushion -->
  <ellipse cx="462" cy="136" rx="98" ry="15" fill="#6b1730"/>
  <ellipse cx="462" cy="131" rx="92" ry="10" fill="#9a2a46"/>

  <g class="breathe">
    <!-- body -->
    <path d="M420 128 C 420 100, 440 82, 472 82 C 506 82, 524 100, 522 116 C 520 128, 508 132, 480 132 L 430 132 Z" fill="#fbfaf7"/>
    <g clip-path="url(#b)">
      <ellipse cx="486" cy="92" rx="22" ry="16" fill="#16131c" transform="rotate(8 486 92)"/>
      <ellipse cx="470" cy="136" rx="60" ry="9" fill="#e7e2dc"/>
    </g>
  </g>

  <!-- tail wrapped around, tip curls slowly -->
  <path d="M516 122 C 524 134, 500 140, 466 138 C 446 137, 434 134, 428 128" stroke="#16131c" stroke-width="10" stroke-linecap="round" fill="none">
    <animate attributeName="d" dur="7s" repeatCount="indefinite" values="M516 122 C 524 134, 500 140, 466 138 C 446 137, 434 134, 428 128;M516 122 C 526 134, 502 141, 468 139 C 448 138, 436 132, 432 124;M516 122 C 526 134, 502 141, 468 139 C 448 138, 436 132, 432 124;M516 122 C 524 134, 500 140, 466 138 C 446 137, 434 134, 428 128;M516 122 C 524 134, 500 140, 466 138 C 446 137, 434 134, 428 128" keyTimes="0;0.25;0.45;0.7;1" calcMode="spline" keySplines=".45 0 .55 1;0 0 1 1;.45 0 .55 1;0 0 1 1"/>
  </path>

  <!-- front paws tucked under chin -->
  <ellipse cx="428" cy="131" rx="11" ry="5" fill="#fbfaf7" stroke="#e2ddd6" stroke-width="1"/>
  <path d="M424 129 v4 M428 129 v4 M432 129 v4" stroke="#d6d0c8" stroke-width="1" stroke-linecap="round"/>

  <!-- ears -->
  <path d="M397 98 C 393 84, 395 72, 399 67 C 408 72, 415 80, 418 87 Z" fill="#16131c"/>
  <path d="M445 98 C 449 84, 447 72, 443 67 C 434 72, 427 80, 424 87 Z" fill="#16131c"/>
  <path d="M400 91 C 398 82, 399 76, 401 73 C 406 76, 410 81, 412 85 Z" fill="#e8a3b4"/>
  <path d="M442 91 C 444 82, 443 76, 441 73 C 436 76, 432 81, 430 85 Z" fill="#e8a3b4"/>

  <!-- head -->
  <path d="M396 100 C 396 89, 409 84, 421 84 C 433 84, 446 89, 446 100 C 449 110, 445 120, 435 125 C 428 128, 414 128, 407 125 C 397 120, 393 110, 396 100 Z" fill="#fbfaf7"/>
  <g clip-path="url(#h)">
    <path d="M386 78 L456 78 L456 101 C 447 98, 439 98, 433 101 C 429 96, 425 90, 423.5 84 L 418.5 84 C 417 90, 413 96, 409 101 C 403 98, 395 98, 386 101 Z" fill="#16131c"/>
  </g>

  <!-- collar -->
  <path d="M403 124 Q421 132 439 124" stroke="#2a3a78" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <circle cx="421" cy="131" r="2.6" fill="#e8b84a"/>

  <!-- closed sleepy eyes -->
  <path d="M404 107 q5.5 4 11 0" stroke="#16131c" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M427 107 q5.5 4 11 0" stroke="#16131c" stroke-width="2" fill="none" stroke-linecap="round"/>

  <ellipse cx="403" cy="115" rx="3.8" ry="2" fill="#f2a3b5" opacity=".45"/>
  <ellipse cx="439" cy="115" rx="3.8" ry="2" fill="#f2a3b5" opacity=".45"/>

  <!-- nose, black spot on the right, little smile -->
  <path d="M418.9 112.4 h4.2 l-2.1 2.4 z" fill="#e48aa0"/>
  <ellipse cx="425.6" cy="114" rx="2.2" ry="1.6" fill="#16131c" transform="rotate(-15 425.6 114)"/>
  <path d="M421 114.8 v1.4 M421 116.2 q-1.5 1.8 -3.2 .4 M421 116.2 q1.5 1.8 3.2 .4" stroke="#8a7f86" stroke-width="1" fill="none" stroke-linecap="round"/>

  <g stroke="#cfc8c0" stroke-width=".9" stroke-linecap="round" fill="none">
    <path d="M406 115 Q397 113 388 113 M406 117.5 Q397 118 389 120"/>
    <path d="M436 115 Q445 113 454 113 M436 117.5 Q445 118 453 120"/>
  </g>

  <text class="z" x="452" y="70" font-size="16">z</text>
  <text class="z" x="464" y="60" font-size="20" style="animation-delay:1.2s">z</text>
  <text class="z" x="478" y="48" font-size="24" style="animation-delay:2.4s">z</text>
  <text x="450" y="162" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#7fa9d6">nila says thanks for stopping by! </text>
</svg>