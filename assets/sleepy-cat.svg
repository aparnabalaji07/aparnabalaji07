    .z { font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight:700; fill:#e8963f; opacity:0; animation: zz 3.6s ease-out infinite; }
    @keyframes zz { 0% { opacity:0; transform: translate(0,0) } 20% { opacity:1 } 100% { opacity:0; transform: translate(18px,-34px) } }
    .tw { animation: tw 3s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity:.2 } 50% { opacity:1 } }
  </style>
  <rect width="900" height="170" rx="22" fill="#1a1230"/>
