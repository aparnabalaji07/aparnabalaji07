<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14183a"/>
      <stop offset="0.6" stop-color="#3a1433"/>
      <stop offset="1" stop-color="#6b1730"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.6" stop-color="#e8963f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e8963f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="card"><rect width="900" height="260" rx="22"/></clipPath>
    <clipPath id="headClip"><circle cx="700" cy="122" r="27"/></clipPath>
    <clipPath id="bodyClip2"><path d="M666 214 C 656 184, 664 154, 684 145 L 716 145 C 736 154, 744 184, 734 214 Z"/></clipPath>
    <clipPath id="headClip2"><path d="M671 110 C 671 98, 686 93, 700 93 C 714 93, 729 98, 729 110 C 733 122, 728 134, 716 140 C 708 144, 692 144, 684 140 C 672 134, 667 122, 671 110 Z"/></clipPath>
    <clipPath id="bodyClip"><ellipse cx="700" cy="180" rx="35" ry="38"/></clipPath>
  </defs>
  <style>
    .tw { animation: tw 3s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .2 } 50% { opacity: 1 } }
    .shoot { animation: shoot 7s linear infinite; opacity: 0; }
    @keyframes shoot {
      0%   { transform: translate(60px,20px) rotate(18deg); opacity: 0 }
      2%   { opacity: 1 }
      12%  { transform: translate(430px,140px) rotate(18deg); opacity: 0 }
      100% { transform: translate(430px,140px) rotate(18deg); opacity: 0 }
    }
    .tail { transform-origin: 728px 208px; animation: swish 2.4s ease-in-out infinite; }
    @keyframes swish { 0%,100% { transform: rotate(-8deg) } 50% { transform: rotate(10deg) } }
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1) } 95% { transform: scaleY(.1) } }
    .heart { animation: float 3.2s ease-out infinite; }
    @keyframes float {
      0%   { transform: translate(726px,74px) scale(.6); opacity: 0 }
      15%  { opacity: 1 }
      100% { transform: translate(742px,36px) scale(1.1); opacity: 0 }
    }
  </style>
  <g clip-path="url(#card)">
    <rect width="900" height="260" fill="url(#sky)"/>
    <g fill="#f3d9c6">
      <circle class="tw" cx="40"  cy="30"  r="1.6"/>
      <circle class="tw" cx="110" cy="225" r="1.3" style="animation-delay:.4s"/>
      <circle class="tw" cx="180" cy="40"  r="2"   style="animation-delay:1.1s"/>
      <circle class="tw" cx="260" cy="235" r="1.4" style="animation-delay:.7s"/>
      <circle class="tw" cx="330" cy="28"  r="1.2" style="animation-delay:1.8s"/>
      <circle class="tw" cx="400" cy="230" r="1.8" style="animation-delay:.2s"/>
      <circle class="tw" cx="455" cy="60"  r="1.3" style="animation-delay:2.2s"/>
      <circle class="tw" cx="540" cy="215" r="2"   style="animation-delay:1.4s"/>
      <circle class="tw" cx="560" cy="30"  r="1.5" style="animation-delay:.9s"/>
      <circle class="tw" cx="600" cy="140" r="1.6" style="animation-delay:.5s"/>
      <circle class="tw" cx="660" cy="40"  r="1.4" style="animation-delay:2.4s"/>
      <circle class="tw" cx="870" cy="160" r="1.3" style="animation-delay:.3s"/>
      <circle class="tw" cx="855" cy="235" r="1.7" style="animation-delay:2s"/>
      <circle class="tw" cx="20"  cy="140" r="1.4" style="animation-delay:1.2s"/>
    </g>
    <g fill="#e8963f">
      <path class="tw" style="animation-delay:.6s" d="M215 205 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
      <path class="tw" style="animation-delay:1.9s" d="M600 60 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z"/>
      <path class="tw" style="animation-delay:1.3s" d="M860 200 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>
    </g>
    <g class="shoot"><rect x="-70" y="-1" width="70" height="2" rx="1" fill="url(#trail)"/></g>

    <!-- moon, off to the side so white Nila stands out against the sky -->
    <circle cx="805" cy="88" r="85" fill="url(#glow)"/>
    <circle cx="805" cy="88" r="56" fill="#e8963f"/>
    <circle cx="784" cy="70" r="9" fill="#c97a2c"/>
    <circle cx="826" cy="106" r="7" fill="#c97a2c"/>
    <circle cx="822" cy="66" r="4.5" fill="#c97a2c"/>

    <!-- ledge -->
    <rect x="600" y="214" width="200" height="10" rx="5" fill="#0d0b16"/>
    <rect x="618" y="224" width="164" height="40" fill="#1a0d1c"/>

    <!-- tail: base stays still, the tip curls and uncurls slowly -->
    <path d="M728 206 C 766 212, 782 186, 772 160 C 766 146, 756 146, 754 154" stroke="#16131c" stroke-width="10" stroke-linecap="round" fill="none">
      <animate attributeName="d" dur="6s" repeatCount="indefinite" values="M728 206 C 766 212, 782 186, 772 160 C 766 146, 756 146, 754 154;M728 206 C 766 212, 780 188, 774 162 C 772 150, 780 142, 786 148;M728 206 C 766 212, 780 188, 774 162 C 772 150, 780 142, 786 148;M728 206 C 766 212, 782 186, 772 160 C 766 146, 756 146, 754 154;M728 206 C 766 212, 782 186, 772 160 C 766 146, 756 146, 754 154" keyTimes="0;0.25;0.4;0.65;1" calcMode="spline" keySplines=".45 0 .55 1;0 0 1 1;.45 0 .55 1;0 0 1 1"/>
    </path>

    <!-- body -->
    <path d="M666 214 C 656 184, 664 154, 684 145 L 716 145 C 736 154, 744 184, 734 214 Z" fill="#fbfaf7"/>
    <g clip-path="url(#bodyClip2)">
      <ellipse cx="732" cy="178" rx="13" ry="16" fill="#16131c" transform="rotate(-15 732 178)"/>
      <ellipse cx="700" cy="218" rx="40" ry="10" fill="#e7e2dc"/>
    </g>
    <path d="M692 160 q4 5 8 0 q4 5 8 0" stroke="#e2ddd6" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M694 168 q3 4 6 0 q3 4 6 0" stroke="#e2ddd6" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <ellipse cx="687" cy="213" rx="10" ry="5.5" fill="#fbfaf7" stroke="#e2ddd6" stroke-width="1"/>
    <ellipse cx="713" cy="213" rx="10" ry="5.5" fill="#fbfaf7" stroke="#e2ddd6" stroke-width="1"/>
    <path d="M684 211 v4 M688 211 v4 M710 211 v4 M714 211 v4" stroke="#d6d0c8" stroke-width="1" stroke-linecap="round"/>

    <!-- tall upright ears -->
    <path d="M672 108 C 668 92, 670 78, 674 72 C 684 78, 692 88, 696 96 Z" fill="#16131c"/>
    <path d="M728 108 C 732 92, 730 78, 726 72 C 716 78, 708 88, 704 96 Z" fill="#16131c"/>
    <path d="M675 100 C 673 90, 674 82, 676 78 C 682 82, 687 88, 690 94 Z" fill="#e8a3b4"/>
    <path d="M725 100 C 727 90, 726 82, 724 78 C 718 82, 713 88, 710 94 Z" fill="#e8a3b4"/>

    <!-- head: wide cheeks, softer chin -->
    <path d="M671 110 C 671 98, 686 93, 700 93 C 714 93, 729 98, 729 110 C 733 122, 728 134, 716 140 C 708 144, 692 144, 684 140 C 672 134, 667 122, 671 110 Z" fill="#fbfaf7"/>
    <g clip-path="url(#headClip2)">
      <path d="M660 88 L740 88 L740 114 C 730 111, 720 111, 713 114 C 708 108, 704 101, 702.5 94 L 697.5 94 C 696 101, 692 108, 687 114 C 680 111, 670 111, 660 114 Z" fill="#16131c"/>
    </g>

    <!-- collar -->
    <path d="M681 142 Q700 151 719 142" stroke="#2a3a78" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="700" cy="150" r="3" fill="#e8b84a"/>

    <!-- almond eyes, tilted up at the outer corners -->
    <g class="eye">
      <ellipse cx="688" cy="120.5" rx="6.2" ry="5" fill="#b9c25a" transform="rotate(12 688 120.5)"/>
      <ellipse cx="688.3" cy="120.8" rx="2.6" ry="4" fill="#1b1a12"/>
      <circle cx="690" cy="118.8" r="1.5" fill="#ffffff"/>
    </g>
    <g class="eye">
      <ellipse cx="712" cy="120.5" rx="6.2" ry="5" fill="#b9c25a" transform="rotate(-12 712 120.5)"/>
      <ellipse cx="711.7" cy="120.8" rx="2.6" ry="4" fill="#1b1a12"/>
      <circle cx="713.4" cy="118.8" r="1.5" fill="#ffffff"/>
    </g>

    <ellipse cx="681" cy="130" rx="4" ry="2.2" fill="#f2a3b5" opacity=".45"/>
    <ellipse cx="719" cy="130" rx="4" ry="2.2" fill="#f2a3b5" opacity=".45"/>

    <!-- pink nose, her black spot on the right side, a little :3 smile -->
    <path d="M697.8 127.6 h4.4 l-2.2 2.6 z" fill="#e48aa0"/>
    <ellipse cx="704.8" cy="129.4" rx="2.4" ry="1.7" fill="#16131c" transform="rotate(-15 704.8 129.4)"/>
    <path d="M700 130.2 v1.6 M700 131.8 q-1.6 2 -3.4 .4 M700 131.8 q1.6 2 3.4 .4" stroke="#8a7f86" stroke-width="1" fill="none" stroke-linecap="round"/>

    <g stroke="#cfc8c0" stroke-width=".9" stroke-linecap="round" fill="none">
      <path d="M684 130 Q674 127 664 127 M684 132.5 Q674 133 665 135"/>
      <path d="M716 130 Q726 127 736 127 M716 132.5 Q726 133 735 135"/>
    </g>

    <g class="heart"><path d="M0 3 C0 -1.5 5 -1.5 5 2.5 C5 -1.5 10 -1.5 10 3 C10 7 6 9.5 5 11.5 C4 9.5 0 7 0 3Z" fill="#e0506e"/></g>

    <text x="56" y="124" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="700" fill="#f0a24a">hi, i am aparna</text>
    <text x="58" y="164" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="600" fill="#7fa9d6">computer science student at <tspan fill="#e0506e">ut dallas</tspan></text>
  </g>
</svg>
